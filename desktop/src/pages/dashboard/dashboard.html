<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Supermarket Fly</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #ecf0f1; margin: 0;}
        .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center;}
        .btn-logout { margin-top: 20px; padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer;}
    </style>
</head>
<body>
    <div class="card">
        <h1>Chào mừng tới Supermarket Fly</h1>
        <h3 id="welcomeMessage">Đang tải...</h3>
        <button class="btn-logout" id="btnLogout">Đăng xuất</button>
    </div>

    <script>
        // Kiểm tra xem đã đăng nhập chưa
        const token = localStorage.getItem('fly_token');
        const userStr = localStorage.getItem('fly_user');

        if (!token || !userStr) {
            // Không có token -> Đá về trang đăng nhập
            window.location.href = '../login/login.html';
        } else {
            const user = JSON.parse(userStr);
            document.getElementById('welcomeMessage').innerText = `Xin chào ${user.TenNV} (${user.TenVaiTro})`;
        }

        // Xử lý Đăng xuất
        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('fly_token');
            localStorage.removeItem('fly_user');
            window.location.href = '../login/login.html';
        });
    </script>
</body>
</html>
